<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Threnody 3.0 vs V2 vs Qwen3.5-9B Base benchmark scorecard</title>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .eyebrow { fill: #c2410c; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .title { fill: #0f172a; font-size: 22px; font-weight: 800; }
    .subtitle { fill: #64748b; font-size: 13px; }
    .legend { fill: #334155; font-size: 12.5px; font-weight: 600; }
    .axis { fill: #94a3b8; font-size: 11px; font-weight: 500; text-anchor: middle; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .grid-base { stroke: #cbd5e1; stroke-width: 1; }
    .sep { stroke: #eef2f7; stroke-width: 1; }
    .rt { fill: #0f172a; font-size: 15px; font-weight: 700; }
    .rs { fill: #64748b; font-size: 11.5px; }
    .n1 { fill: #334155; font-size: 11.5px; font-weight: 600; }
    .n2 { fill: #64748b; font-size: 11px; }
    .base { fill: #94a3b8; }
    .v2 { fill: #3b82f6; }
    .v3 { fill: #f97316; }
    .val { fill: #0f172a; font-size: 12.5px; font-weight: 700; }
    .val3 { fill: #c2410c; font-size: 12.5px; font-weight: 800; }
    .sub { fill: #94a3b8; font-size: 11px; font-weight: 500; }
    .bw { fill: #ecfdf5; stroke: #a7f3d0; }
    .bwt { fill: #047857; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    .bn { fill: #f1f5f9; stroke: #e2e8f0; }
    .bnt { fill: #475569; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .meta { fill: #64748b; font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f17; }
      .card { fill: #111827; stroke: #1f2937; }
      .eyebrow { fill: #fb923c; }
      .title { fill: #f8fafc; }
      .subtitle, .rs, .n2, .meta { fill: #94a3b8; }
      .legend, .n1 { fill: #cbd5e1; }
      .axis, .sub { fill: #64748b; }
      .grid { stroke: #1f2937; }
      .grid-base { stroke: #334155; }
      .sep { stroke: #1a2232; }
      .rt, .val { fill: #f8fafc; }
      .base { fill: #64748b; }
      .v2 { fill: #3b82f6; }
      .v3 { fill: #fb923c; }
      .val3 { fill: #fdba74; }
      .bw { fill: #064e3b; stroke: #047857; }
      .bwt { fill: #34d399; }
      .bn { fill: #1e293b; stroke: #334155; }
      .bnt { fill: #94a3b8; }
    }
  </style>
  <rect class="bg" width="960" height="600" rx="14"/>
  <rect class="card" x="14.5" y="14.5" width="931" height="571" rx="12"/>
  <text class="eyebrow" x="40" y="46">AXIOM INFERENCE · FRONTIER BENCHMARK</text>
  <text class="title" x="40" y="74">Threnody 3.0 Performance Scorecard</text>
  <text class="subtitle" x="40" y="96">Full adapter strength (s0.75) leads on held-out coding and domain reasoning with zero action looping</text>
  <g>
    <rect class="base" x="40" y="113" width="12" height="12" rx="3"/>
    <text class="legend" x="58" y="123">Qwen3.5-9B Base</text>
    <rect class="v2" x="190" y="113" width="12" height="12" rx="3"/>
    <text class="legend" x="208" y="123">Threnody V2 (s0.3)</text>
    <rect class="v3" x="350" y="113" width="12" height="12" rx="3"/>
    <text class="legend" x="368" y="123">Threnody 3.0 (s0.75)</text>
  </g>
  <line class="grid-base" x1="320.0" y1="144" x2="320.0" y2="506"/>
  <text class="axis" x="320.0" y="138">0%</text>
  <line class="grid" x1="432.5" y1="144" x2="432.5" y2="506"/>
  <text class="axis" x="432.5" y="138">25%</text>
  <line class="grid" x1="545.0" y1="144" x2="545.0" y2="506"/>
  <text class="axis" x="545.0" y="138">50%</text>
  <line class="grid" x1="657.5" y1="144" x2="657.5" y2="506"/>
  <text class="axis" x="657.5" y="138">75%</text>
  <line class="grid" x1="770.0" y1="144" x2="770.0" y2="506"/>
  <text class="axis" x="770.0" y="138">100%</text>
  <g>
    <text class="rt" x="40" y="164">Held-Out Coding</text>
    <text class="rs" x="40" y="181">opencode · 14 unseen tasks</text>
    <text class="n1" x="40" y="204">Zero action loops (rep=1)</text>
    <text class="n2" x="40" y="220">12 of 13 passed in 1 attempt</text>
    <rect class="bw" x="178" y="150" width="118" height="20" rx="10"/>
    <text class="bwt" x="237.0" y="164">+7.2 pts vs Base</text>
    <rect class="base" x="320" y="152" width="385.6" height="18" rx="4"/>
    <text x="713.6" y="165"><tspan class="val">85.7%</tspan><tspan class="sub" dx="6">12/14</tspan></text>
    <rect class="v2" x="320" y="177" width="321.3" height="18" rx="4"/>
    <text x="649.3" y="190"><tspan class="val">71.4%</tspan><tspan class="sub" dx="6">10/14</tspan></text>
    <rect class="v3" x="320" y="202" width="418.0" height="18" rx="4"/>
    <text x="746.0" y="215"><tspan class="val3">92.9%</tspan><tspan class="sub" dx="6">13/14</tspan></text>
  </g>
  <line class="sep" x1="40" y1="232" x2="920" y2="232"/>
  <g>
    <text class="rt" x="40" y="256">BioChem Reasoning</text>
    <text class="rs" x="40" y="273">MMLU-Pro · 400 hard questions</text>
    <text class="n1" x="40" y="296">Chemistry: 73.5% vs 69.4%</text>
    <text class="n2" x="40" y="312">Biology retained at 86.5%</text>
