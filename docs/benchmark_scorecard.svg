    <text class="bwt" x="246.5" y="256">+4.1 pts Chem</text>
    <rect class="base" x="320" y="244" width="342.0" height="18" rx="4"/>
    <text x="670.0" y="257"><tspan class="val">76.0%</tspan><tspan class="sub" dx="6">overall</tspan></text>
    <rect class="v2" x="320" y="269" width="344.2" height="18" rx="4"/>
    <text x="672.2" y="282"><tspan class="val">76.5%</tspan><tspan class="sub" dx="6">overall</tspan></text>
    <rect class="v3" x="320" y="294" width="353.2" height="18" rx="4"/>
    <text x="681.2" y="307"><tspan class="val3">78.5%</tspan><tspan class="sub" dx="6">overall</tspan></text>
  </g>
  <line class="sep" x1="40" y1="324" x2="920" y2="324"/>
  <g>
    <text class="rt" x="40" y="348">OmniAgent-Bench</text>
    <text class="rs" x="40" y="365">16 multi-turn tool schemas</text>
    <text class="n1" x="40" y="388">Robust schema execution</text>
    <text class="n2" x="40" y="404">Passed 13 of 16 multi-step sets</text>
    <rect class="bn" x="203" y="334" width="93" height="20" rx="10"/>
    <text class="bnt" x="249.5" y="348">13/16 passed</text>
    <rect class="base" x="320" y="336" width="417.1" height="18" rx="4"/>
    <text x="745.1" y="349"><tspan class="val">92.7%</tspan><tspan class="sub" dx="6">15/16</tspan></text>
    <rect class="v2" x="320" y="361" width="417.1" height="18" rx="4"/>
    <text x="745.1" y="374"><tspan class="val">92.7%</tspan><tspan class="sub" dx="6">15/16</tspan></text>
    <rect class="v3" x="320" y="386" width="380.7" height="18" rx="4"/>
    <text x="708.7" y="399"><tspan class="val3">84.6%</tspan><tspan class="sub" dx="6">13/16</tspan></text>
  </g>
  <line class="sep" x1="40" y1="416" x2="920" y2="416"/>
  <g>
    <text class="rt" x="40" y="440">AgentLoop In-Harness</text>
    <text class="rs" x="40" y="457">14 standard training schemas</text>
    <text class="n1" x="40" y="480">Zero loop death</text>
    <text class="n2" x="40" y="496">Base looped up to 18×</text>
    <rect class="bn" x="241" y="426" width="55" height="20" rx="10"/>
    <text class="bnt" x="268.5" y="440">Stable</text>
    <rect class="base" x="320" y="428" width="353.7" height="18" rx="4"/>
    <text x="681.7" y="441"><tspan class="val">78.6%</tspan><tspan class="sub" dx="6">11/14</tspan></text>
    <rect class="v2" x="320" y="453" width="353.7" height="18" rx="4"/>
    <text x="681.7" y="466"><tspan class="val">78.6%</tspan><tspan class="sub" dx="6">11/14</tspan></text>
    <rect class="v3" x="320" y="478" width="321.3" height="18" rx="4"/>
    <text x="649.3" y="491"><tspan class="val3">71.4%</tspan><tspan class="sub" dx="6">10/14</tspan></text>
  </g>
  <line class="sep" x1="40" y1="542" x2="920" y2="542"/>
  <text class="meta" x="40" y="562">✓ Zero repetition loops on passes (rep=1)</text>
  <text class="meta" x="480" y="562" text-anchor="middle">✓ Arditi et al. layers 12–28 refusal orthogonalization</text>
  <text class="meta" x="920" y="562" text-anchor="end">✓ Decoupled FP16 vision projector (mmproj)</text>
</svg>
